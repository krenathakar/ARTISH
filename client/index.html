<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/artish-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artish UK | Content, Social Media & Digital Marketing</title>
    <meta name="description" content="Artish UK helps restaurants, events and growing businesses attract customers through professional content creation, social media management, video production and digital marketing." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Artish UK | Content, Social Media & Digital Marketing" />
    <meta property="og:description" content="Artish UK helps restaurants, events and growing businesses attract customers through professional content creation, social media management, video production and digital marketing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://artish.uk" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Artish UK | Content, Social Media & Digital Marketing" />
    <meta name="twitter:description" content="Content that brings customers. UK Digital Marketing & Content Agency." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Suppress and remove any Netlify injected badge / branding element -->
    <style id="suppress-netlify-badge">
      iframe[src*="netlify"],
      iframe[id*="netlify" i],
      iframe[class*="netlify" i],
      iframe[title*="Netlify" i],
      [id*="netlify" i],
      [class*="netlify-badge" i],
      [data-netlify-badge],
      netlify-badge,
      #netlify-badge,
      .netlify-badge {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        position: absolute !important;
        z-index: -9999 !important;
        clip: rect(0, 0, 0, 0) !important;
        overflow: hidden !important;
      }
    </style>
    <script>
      (function() {
        var selectors = [
          'iframe[src*="netlify"]',
          'iframe[id*="netlify" i]',
          'iframe[class*="netlify" i]',
          'iframe[title*="Netlify" i]',
          '[id*="netlify" i]',
          '[class*="netlify-badge" i]',
          '[data-netlify-badge]',
          'netlify-badge',
          '#netlify-badge',
          '.netlify-badge'
        ];
        function removeNetlifyElements() {
          selectors.forEach(function(sel) {
            try {
              var matches = document.querySelectorAll(sel);
              for (var i = 0; i < matches.length; i++) {
                matches[i].remove();
              }
            } catch (e) {}
          });
          try {
            localStorage.setItem('nl-hud:public:v1', 'hidden');
          } catch (e) {}
        }
        removeNetlifyElements();
        document.addEventListener('DOMContentLoaded', removeNetlifyElements);
        window.addEventListener('load', removeNetlifyElements);
        if (window.MutationObserver) {
          var observer = new MutationObserver(function() {
            removeNetlifyElements();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="bg-[#F7F8FA] text-[#101946] font-sans antialiased">
    <div id="root"></div>

    <!-- Hidden form for Netlify Form detection & dashboard lead capture -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="text" name="businessName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
